<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Atur kata sandi baru — KarsaGuru</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/extras.css"></head>
<body class="auth-body">
<main class="auth-layout">
  <section class="auth-aside">
    <a class="brand brand-light" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg></span><span>Karsa<span>Guru</span></span></a>
    <div><h1>Buat kata sandi baru.</h1><p>Lalu lanjut menyiapkan pembelajaran.</p></div>
    <span></span>
  </section>
  <section class="auth-main">
    <div class="auth-card">
      <div class="auth-mobile-brand"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg></span><span>Karsa<span>Guru</span></span></a></div>
      <div class="auth-heading"><h2>Kata sandi baru</h2><p>Minimal 8 karakter.</p></div>
      <form id="resetForm" hidden>
        <label for="password">Kata sandi baru</label>
        <div class="password-wrap"><input id="password" name="password" type="password" placeholder="Minimal 8 karakter" minlength="8" required><button type="button" class="show-password" data-toggle-password="password">Lihat</button></div>
        <label for="confirm">Ulangi kata sandi</label>
        <input id="confirm" name="confirm" type="password" placeholder="Ketik ulang" minlength="8" required>
        <button class="button button-primary button-full" type="submit">Simpan kata sandi</button>
      </form>
      <p class="form-message" id="formMessage" aria-live="polite">Memeriksa tautan...</p>
      <p class="auth-switch"><a href="login.html">Kembali ke halaman masuk</a></p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/reset-password.js"></script>
</body></html>
